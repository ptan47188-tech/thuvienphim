<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineTrack - Thư Viện Phim Đã Xem</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }

    /* Header & Navigation */
    header {
      background: #0f172a;
      border-bottom: 1px solid var(--card-border);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }

    /* Buttons */
    .btn {
      background: #1e293b;
      color: var(--text);
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
      touch-action: manipulation;
    }
    .btn-primary { background: var(--primary); color: #000; border: none; }
    .btn-primary:active { background: var(--primary-hover); }
    .btn-sm { padding: 5px 10px; min-height: 32px; font-size: 0.8rem; }
    .btn-danger { background: #7f1d1d; color: #fecaca; border: 1px solid #991b1b; }

    /* Controls Bar */
    .main-layout { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 0.95rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); }
    .filter-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .pill {
      background: #1e293b;
      color: var(--text-muted);
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.825rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .pill.active { background: var(--primary); color: #000; font-weight: 600; }

    .view-toggle {
      display: flex;
      background: #0f172a;
      padding: 3px;
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
      width: fit-content;
    }
    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .view-btn.active { background: #1e293b; color: var(--text); font-weight: 600; }

    /* Series & Movie Layouts */
    .series-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
    }
    .series-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
    }
    .series-title { font-size: 1.15rem; color: var(--primary); font-weight: 700; }
    .series-desc { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
    
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 12px;
    }
    .poster-grid-only {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }

    /* Movie Card */
    .movie-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .movie-card:active { transform: scale(0.98); }
    .poster-box {
      width: 100%;
      aspect-ratio: 2/3;
      background: #1e293b;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .poster-img { width: 100%; height: 100%; object-fit: cover; }
    .badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      color: var(--primary);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .movie-info { padding: 8px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .movie-title { font-size: 0.85rem; font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .movie-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted); }
    .stars { color: #f59e0b; font-size: 0.75rem; }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: var(--radius);
    }
    .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-title { font-size: 1.1rem; margin-bottom: 6px; }
    .empty-sub { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 20px; }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal {
      background: #131b2e;
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      position: relative;
    }
    .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; color: var(--primary); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    .form-control {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }
    .form-control:focus { border-color: var(--primary); }
    textarea.form-control { resize: vertical; min-height: 70px; }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    /* Fullscreen Lightbox */
    .lightbox {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.95);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      display: none;
    }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 95vw; max-height: 95vh; object-fit: contain; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <div class="brand">🎬 CineTrack</div>
      <div class="header-actions">
        <button class="btn" onclick="openModal('backupModal')">📁 Dữ Liệu</button>
        <button class="btn btn-primary" onclick="openAddSeriesModal()">➕ Thêm Mục</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-layout">
    <!-- Search & Filters (Render tĩnh sẵn trong HTML) -->
    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Tìm tên phim, tên mục..." oninput="renderApp()">
      
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <div class="filter-pills" id="typeFilters">
          <button class="pill active" onclick="setFilter('Tất cả', this)">Tất cả</button>
          <button class="pill" onclick="setFilter('Phim chính', this)">Phim chính</button>
          <button class="pill" onclick="setFilter('Movie', this)">Movie</button>
          <button class="pill" onclick="setFilter('OVA', this)">OVA</button>
          <button class="pill" onclick="setFilter('Ngoại truyện', this)">Ngoại truyện</button>
          <button class="pill" onclick="setFilter('Special', this)">Special</button>
        </div>

        <div class="view-toggle">
          <button class="view-btn active" id="viewSeriesBtn" onclick="setViewMode('series')">Theo Mục</button>
          <button class="view-btn" id="viewPostersBtn" onclick="setViewMode('posters')">Tất cả Poster</button>
        </div>
      </div>
    </div>

    <!-- Main Dynamic Content Container (Khung chứa dữ liệu) -->
    <div id="mainContent">
      <div class="empty-state">
        <div class="empty-icon">🍿</div>
        <div class="empty-title">Đang tải bộ sưu tập...</div>
        <div class="empty-sub">Nếu trang trống quá vài giây, hãy bấm nút tạo dữ liệu mẫu bên dưới.</div>
        <div style="display:flex; justify-content:center; gap:10px;">
          <button class="btn btn-primary" onclick="createSampleData()">✨ Tạo Dữ Liệu Mẫu</button>
          <button class="btn" onclick="openAddSeriesModal()">➕ Tạo Mục Mới</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal Thêm/Sửa Mục Phim -->
  <div class="modal-overlay" id="seriesModal">
    <div class="modal">
      <div class="modal-title" id="seriesModalTitle">Thêm Mục / Series Phim</div>
      <form id="seriesForm" onsubmit="saveSeries(event)">
        <input type="hidden" id="seriesId">
        <div class="form-group">
          <label>Tên Mục / Series *</label>
          <input type="text" id="seriesTitle" class="form-control" placeholder="Ví dụ: Thám Tử Lừng Danh Conan, Marvel..." required>
        </div>
        <div class="form-group">
          <label>Mô tả ngắn</label>
          <textarea id="seriesDesc" class="form-control" placeholder="Ghi chú về mục phim này..."></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn" onclick="closeModal('seriesModal')">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu Mục</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Thêm/Sửa Phim Con -->
  <div class="modal-overlay" id="movieModal">
    <div class="modal">
      <div class="modal-title" id="movieModalTitle">Thêm Phim Con</div>
      <form id="movieForm" onsubmit="saveMovie(event)">
        <input type="hidden" id="movieId">
        <input type="hidden" id="movieSeriesId">
        
        <div class="form-group">
          <label>Tên phim *</label>
          <input type="text" id="movieTitle" class="form-control" placeholder="Nhập tên tập phim / movie..." required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label>Phân loại</label>
            <select id="movieType" class="form-control">
              <option value="Phim chính">Phim chính</option>
              <option value="Movie">Movie</option>
              <option value="OVA">OVA</option>
              <option value="Ngoại truyện">Ngoại truyện</option>
              <option value="Special">Special</option>
            </select>
          </div>
          <div class="form-group">
            <label>Năm phát hành</label>
            <input type="number" id="movieYear" class="form-control" placeholder="2024">
          </div>
        </div>

        <div class="form-group">
          <label>Đánh giá (1 đến 5 sao)</label>
          <select id="movieRating" class="form-control">
            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
            <option value="4">⭐⭐⭐⭐ (4/5)</option>
            <option value="3">⭐⭐⭐ (3/5)</option>
            <option value="2">⭐⭐ (2/5)</option>
            <option value="1">⭐ (1/5)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Ảnh Poster (Ảnh gốc không nén)</label>
          <input type="file" id="moviePosterInput" class="form-control" accept="image/*">
        </div>

        <div class="form-group">
          <label>Ghi chú cá nhân</label>
          <textarea id="movieNote" class="form-control" placeholder="Cảm nhận, tập hay nhất..."></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn" onclick="closeModal('movieModal')">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu Phim</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Chi Tiết Phim -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal" id="detailModalContent"></div>
  </div>

  <!-- Modal Backup / Restore -->
  <div class="modal-overlay" id="backupModal">
    <div class="modal">
      <div class="modal-title">📁 Quản Lý Dữ Liệu</div>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px;">
        Xuất file lưu trữ dữ liệu bộ sưu tập của bạn hoặc khôi phục từ file có sẵn.
      </p>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn btn-primary" onclick="exportData()">📥 Xuất Dữ Liệu (Backup JSON)</button>
        <label class="btn" style="cursor: pointer;">
          📤 Nhập Dữ Liệu (Restore JSON)
          <input type="file" id="importInput" accept=".json" style="display:none;" onchange="importData(event)">
        </label>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="closeModal('backupModal')">Đóng</button>
      </div>
    </div>
  </div>

  <!-- Fullscreen Image Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" src="" alt="Poster Full">
  </div>

  <script>
    // --- IndexedDB Storage Manager ---
    const DB_NAME = 'CineTrackOriginalDB';
    const DB_VERSION = 1;
    let db = null;

    let currentFilter = 'Tất cả';
    let currentView = 'series';
    let appData = { series: [], movies: [] };
    let objectUrls = [];

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('series')) db.createObjectStore('series', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('movies')) db.createObjectStore('movies', { keyPath: 'id' });
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        req.onerror = (e) => reject(e);
      });
    }

    async function loadData() {
      if (!db) await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction(['series', 'movies'], 'readonly');
        const sStore = tx.objectStore('series');
        const mStore = tx.objectStore('movies');
        
        let series = [], movies = [];
        sStore.getAll().onsuccess = (e) => series = e.target.result || [];
        mStore.getAll().onsuccess = (e) => movies = e.target.result || [];
        
        tx.oncomplete = () => {
          appData = { series, movies };
          resolve(appData);
        };
      });
    }

    async function saveDataItem(storeName, item) {
      const tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).put(item);
      return new Promise((res) => tx.oncomplete = res);
    }

    async function deleteDataItem(storeName, id) {
      const tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).delete(id);
      return new Promise((res) => tx.oncomplete = res);
    }

    // --- Helper Functions ---
    function revokeUrls() {
      objectUrls.forEach(url => URL.revokeObjectURL(url));
      objectUrls = [];
    }

    function getBlobUrl(blob) {
      if (!blob) return '';
      if (typeof blob === 'string') return blob; // fallback data URL
      const url = URL.createObjectURL(blob);
      objectUrls.push(url);
      return url;
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function setFilter(type, btn) {
      currentFilter = type;
      document.querySelectorAll('#typeFilters .pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderApp();
    }

    function setViewMode(mode) {
      currentView = mode;
      document.getElementById('viewSeriesBtn').classList.toggle('active', mode === 'series');
      document.getElementById('viewPostersBtn').classList.toggle('active', mode === 'posters');
      renderApp();
    }

    function openLightbox(src) {
      if (!src) return;
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    // --- Main Render Function ---
    function renderApp() {
      revokeUrls();
      const container = document.getElementById('mainContent');
      const search = document.getElementById('searchInput').value.toLowerCase().trim();

      // Filter movies
      let filteredMovies = appData.movies.filter(m => {
        const matchSearch = m.title.toLowerCase().includes(search) || (m.note && m.note.toLowerCase().includes(search));
        const matchType = currentFilter === 'Tất cả' || m.type === currentFilter;
        return matchSearch && matchType;
      });

      if (appData.series.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎬</div>
            <div class="empty-title">Bộ Sưu Tập Đang Trống</div>
            <div class="empty-sub">Hãy tạo mục phim đầu tiên hoặc nạp dữ liệu mẫu để thử ngay!</div>
            <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
              <button class="btn btn-primary" onclick="createSampleData()">✨ Tạo Dữ Liệu Mẫu</button>
              <button class="btn" onclick="openAddSeriesModal()">➕ Tạo Mục Đầu Tiên</button>
            </div>
          </div>
        `;
        return;
      }

      if (currentView === 'posters') {
        // Mode View Tất Cả Poster
        if (filteredMovies.length === 0) {
          container.innerHTML = `<div class="empty-state"><div class="empty-sub">Không tìm thấy phim phù hợp.</div></div>`;
          return;
        }
        let html = `<div class="poster-grid-only">`;
        filteredMovies.forEach(m => {
          const imgUrl = getBlobUrl(m.posterBlob);
          html += createMovieCardHTML(m, imgUrl);
        });
        html += `</div>`;
        container.innerHTML = html;
      } else {
        // Mode View Theo Series / Mục
        let html = '';
        appData.series.forEach(s => {
          const seriesMovies = filteredMovies.filter(m => m.seriesId === s.id);
          const isMatchi
