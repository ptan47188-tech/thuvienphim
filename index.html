<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CineTrack - Thư Viện Phim Đã Xem</title>
  <style>
    /* RESET & SYSTEM FONTS */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    :root {
      --bg-dark: #0b0f19;
      --bg-surface: #131b2e;
      --bg-surface-hover: #1c2744;
      --bg-card: #182238;
      --bg-input: #1e293b;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --accent-light: rgba(245, 158, 11, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --border: #334155;
      --border-accent: rgba(245, 158, 11, 0.4);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.5);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.7);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* CONTAINER & UTILS */
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }

    /* HEADER BAR */
    header {
      background: linear-gradient(180deg, #131b2e 0%, rgba(19, 27, 46, 0.95) 100%);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
      padding: 14px 0;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #f59e0b, #b45309);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0f19;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
    }

    .logo-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #ffffff, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      min-height: 44px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      touch-action: manipulation;
      user-select: none;
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #0b0f19;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
    }
    .btn-primary:hover {
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.5);
    }

    .btn-secondary {
      background-color: var(--bg-surface-hover);
      color: var(--text-main);
      border-color: var(--border);
    }
    .btn-secondary:hover {
      background-color: var(--border);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border-accent);
      color: var(--accent);
    }
    .btn-outline:hover {
      background: var(--accent-light);
    }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover {
      background-color: var(--danger);
      color: #ffffff;
    }

    .btn-icon-only {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 50%;
    }

    /* CONTROL PANEL (TABS & SEARCH) */
    .control-section {
      margin: 20px 0;
    }

    .tab-bar {
      display: flex;
      background-color: var(--bg-surface);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 14px;
      min-height: 44px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--accent);
      color: #0b0f19;
      box-shadow: var(--shadow-sm);
    }

    .search-filter-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-input-wrapper {
      position: relative;
      width: 100%;
    }

    .search-input-wrapper svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 46px;
      padding: 10px 14px 10px 44px;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .filter-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-pills::-webkit-scrollbar { display: none; }

    .pill-btn {
      padding: 6px 14px;
      min-height: 36px;
      border-radius: 20px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.825rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pill-btn.active {
      background-color: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    /* GRID LAYOUTS */
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .grid-posters {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (min-width: 640px) {
      .grid-posters {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
      }
    }

    /* CATEGORY CARD */
    .cat-card {
      background-color: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
      position: relative;
    }

    .cat-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-accent);
      box-shadow: var(--shadow-md);
    }

    .cat-cover {
      width: 100%;
      height: 160px;
      background-color: var(--bg-surface);
      position: relative;
      overflow: hidden;
    }

    .cat-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cat-cover-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: var(--text-dim);
    }

    .cat-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(11, 15, 25, 0.85);
      border: 1px solid var(--border-accent);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      backdrop-filter: blur(4px);
    }

    .cat-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .cat-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .cat-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .cat-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 12px;
    }

    /* MOVIE CARD / POSTER CARD */
    .movie-card {
      background-color: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .movie-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-accent);
    }

    .poster-box {
      width: 100%;
      aspect-ratio: 2 / 3;
      background-color: var(--bg-surface);
      position: relative;
      overflow: hidden;
    }

    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .poster-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(180deg, #1e293b, #0f172a);
      color: var(--text-dim);
      padding: 10px;
      text-align: center;
    }

    .type-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background-color: rgba(11, 15, 25, 0.85);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(4px);
      z-index: 2;
    }

    .movie-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .movie-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .movie-category-tag {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .star-rating-display {
      display: flex;
      align-items: center;
      gap: 2px;
      color: var(--accent);
    }

    /* BREADCRUMB & DRILLDOWN HEADER */
    .drilldown-header {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    @media (min-width: 640px) {
      .drilldown-header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .drilldown-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .drilldown-thumb {
      width: 70px;
      height: 70px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* MODAL STYLES */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(5, 8, 15, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      transform: translateY(20px);
      transition: transform 0.25s ease;
    }

    .modal-backdrop.active .modal-content {
      transform: translateY(0);
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background-color: var(--bg-surface);
      z-index: 10;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, color 0.2s;
    }

    .modal-close:hover {
      background-color: var(--bg-surface-hover);
      color: var(--text-main);
    }

    .modal-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background-color: rgba(11, 15, 25, 0.4);
    }

    /* FORM INPUTS */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      min-height: 44px;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    textarea.form-control {
      min-height: 90px;
      resize: vertical;
    }

    /* FILE UPLOAD PREVIEW BOX */
    .file-upload-box {
      border: 2px dashed var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      background-color: var(--bg-input);
      cursor: pointer;
      transition: border-color 0.2s;
      position: relative;
    }

    .file-upload-box:hover {
      border-color: var(--accent);
    }

    .file-upload-preview {
      width: 100%;
      max-height: 200px;
      object-fit: contain;
      border-radius: var(--radius-sm);
      margin-top: 10px;
    }

    /* INTERACTIVE STAR RATING */
    .star-rating-input {
      display: flex;
      gap: 8px;
    }

    .star-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 1.6rem;
      cursor: pointer;
      padding: 4px;
      transition: transform 0.1s, color 0.1s;
    }

    .star-btn.active, .star-btn:hover {
      color: var(--accent);
      transform: scale(1.15);
    }

    /* LIGHTBOX FOR 100% UNCOMPRESSED FULLSCREEN POSTER */
    .lightbox-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.95);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 16px;
    }

    .lightbox-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      border-radius: 4px;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      z-index: 2001;
    }

    /* TOAST NOTIFICATION */
    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      background-color: var(--bg-surface);
      border: 1px solid var(--accent);
      color: var(--text-main);
      padding: 12px 20px;
      border-radius: 30px;
      box-shadow: var(--shadow-md);
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toastIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* EMPTY STATE */
    .empty-box {
      text-align: center;
      padding: 60px 20px;
      background-color: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin: 20px 0;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }
  </style>
</head>
<body>

  <!-- HEADER BAR -->
  <header>
    <div class="container flex items-center justify-between">
      <div class="logo-box" id="logoHomeBtn">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19.82 2H4.18C2.97 2 2 2.97 2 4.18v15.64C2 21.03 2.97 22 4.18 22h15.64c1.21 0 2.18-.97 2.18-2.18V4.18C22 2.97 21.03 2 19.82 2z"></path><path d="M7 2v20"></path><path d="M17 2v20"></path><path d="M2 12h20"></path><path d="M2 7h5"></path><path d="M2 17h5"></path><path d="M17 17h5"></path><path d="M17 7h5"></path></svg>
        </div>
        <div>
          <h1 class="logo-title">CineTrack</h1>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button class="btn btn-outline" id="openDataBackupModalBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          <span class="desktop-only">Dữ Liệu</span>
        </button>
        <button class="btn btn-primary" id="headerAddBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>Thêm Mới</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main cla
